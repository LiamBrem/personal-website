name: Sync Substack Posts

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/sync-substack.mjs

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Add new Substack post(s)'
          branch: substack-sync/new-posts
          title: 'New Substack post(s)'
          body: |
            Automated sync from the [Substack RSS feed](https://liambrem.substack.com/feed).

            Review the converted markdown (formatting, links, images) before merging.
          add-paths: src/posts/*.md
